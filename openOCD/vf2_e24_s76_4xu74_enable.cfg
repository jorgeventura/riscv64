#
# VisionFive2 v1.3B / StarFive JH7110 SoC - Complete Multi-Core Config
#

# Use the nTRST signal for resetting the JTAG TAP
reset_config trst_only

# Use the JTAG protocol
transport select jtag

# Set a stable JTAG clock speed
adapter speed 100

# -------------------------------------------------
# The JH7110 has two TAPs on its scan chain with the same ID.
# We must define both of them.
# TAP 0 : S76 monitor core
jtag newtap s76 tap -irlen 5 -expected-id 0x07110cfd
# TAP 1 : E24 + U74 cluster
jtag newtap cluster tap -irlen 5 -expected-id 0x07110cfd

# -------------------------------------------------
# Targets
# S76 monitor (wrench)
target create s76.cpu0 riscv -chain-position s76.tap -coreid 0 -rtos hwthread

# E24 real-time core (HART 0 on cluster TAP)
target create e24.cpu0 riscv -chain-position cluster.tap -coreid 0 -rtos hwthread

# U74 application cores (optional)
target create u74.cpu1 riscv -chain-position cluster.tap -coreid 1
target create u74.cpu2 riscv -chain-position cluster.tap -coreid 2
target create u74.cpu3 riscv -chain-position cluster.tap -coreid 3
target create u74.cpu4 riscv -chain-position cluster.tap -coreid 4
target smp u74.cpu1 u74.cpu2 u74.cpu3 u74.cpu4

# -------------------------------------------------
proc e24_boot_from_s76 {{rstvec 0x6CE00000}} {
    set STG_CRG_BASE     0x0010230000
    set STG_SYSCON_BASE  0x0010240000

    # Offsets (exact)
    set E24_RSTVEC_LO_OFF   0x24
    set E24_RSTVEC_HI_OFF   0x28
    set E24_RST_SEL_OFF     0x74

    set E24_CLK_RTC_OFF     0x60
    set E24_CLK_CORE_OFF    0x64
    set E24_CLK_DBG_OFF     0x68

    # Bits
    set E24_CLK_BIT         0x80000000    ;# bit31
    set E24_RST_CORE_BIT    0x00000010    ;# E24 core reset
    set E24_RST_DOMAIN_BIT  0x00000010    ;# E24 core reset

    #-------------------------------------------------
    targets s76.cpu0
    s76.cpu0 riscv set_mem_access progbuf
    halt
    # ----- 1. Set 64-bit reset vector -----
    write_memory [expr {$STG_SYSCON_BASE + $E24_RSTVEC_LO_OFF}] 32 [expr {$rstvec & 0xFFFFFFFF}]
    write_memory [expr {$STG_SYSCON_BASE + $E24_RSTVEC_HI_OFF}] 32 [expr {$rstvec >> 32}]

    # (optional) plant a loop at the reset vector (RV32: jal x0,0)
    # write_memory $rstvec 32 0x0000006F

    # ---- clocks ----
    # RTC: enable clk_icg (bit31) and set divider to 24 (0x18).
    # If you don't want to change the divider, see the minimal variant below.

    #----set rtc_reg [expr {$STG_CRG_BASE + $E24_CLK_RTC_OFF}]
    #----set rtc_val [lindex [read_memory $rtc_reg 32 1] 0]
    #----write_memory $rtc_reg 32 [expr {$rtc_val | 0x80000000}]

    # ----- 2. Enable clocks -----
    # RTC: gate + divider = 24 (0x18)  -> 0x80000018
    write_memory [expr {$STG_CRG_BASE + $E24_CLK_RTC_OFF}] 32 0x80000018

    foreach off [list $E24_CLK_CORE_OFF $E24_CLK_DBG_OFF] {
        set reg [expr {$STG_CRG_BASE + $off}]
        set cur [lindex [read_memory $reg 32 1] 0]
        write_memory $reg 32 [expr {$cur | $E24_CLK_BIT}]
    }

    # ----- 3. De-assert BOTH reset bits -----
    set rreg [expr {$STG_SYSCON_BASE + $E24_RST_SEL_OFF}]
    set rval [lindex [read_memory $rreg 32 1] 0]
    set rval [expr {$rval & ~($E24_RST_CORE_BIT | $E24_RST_DOMAIN_BIT)}]
    write_memory $rreg 32 $rval

    # verify (prints into telnet)
    mdw [expr {$STG_SYSCON_BASE + $E24_RSTVEC_LO_OFF}] 1
    mdw [expr {$STG_CRG_BASE + $E24_CLK_RTC_OFF}] 1
    mdw [expr {$STG_CRG_BASE + $E24_CLK_CORE_OFF}] 1
    mdw [expr {$STG_CRG_BASE + $E24_CLK_DBG_OFF}] 1
    mdw [expr {$STG_SYSCON_BASE + $E24_RST_SEL_OFF}] 1
    resume
}

proc e24_verify {} {
    # use s76 as the wrench; halt for clean access
    targets s76.cpu0
    halt
    s76.cpu0 riscv set_mem_access progbuf

    set regs {
        RSTVEC_LO  0x0010240024
        RTC_CLK    0x0010230060
        CORE_CLK   0x0010230064
        DBG_CLK    0x0010230068
        RST_SEL    0x0010240074
    }
    foreach {name addr} $regs {
        set v [lindex [read_memory $addr 32 1] 0]
        echo [format "%-9s @ 0x%08X : 0x%08X" $name $addr $v]
    }

    resume
}


