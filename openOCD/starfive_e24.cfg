#
# VisionFive 2 / StarFive JH7110 - E24 Core Only Config
#
# Use the nTRST signal for resetting the JTAG TAP
reset_config trst_only
# Use the JTAG protocol
transport select jtag
# Set a stable JTAG clock speed (lower if unstable)
adapter speed 1000

# The JH7110 has two TAPs on its scan chain with the same ID.
# Define both explicitly to match the full chain.
jtag newtap e24 cpu -irlen 5 -expected-id 0x07110cfd
jtag newtap u74 cpu -irlen 5 -expected-id 0x07110cfd

# Define the target for the E24 monitor core (HART ID 0)
# Variant 1: Attach to first TAP (common scan order: E24 then U74)
target create e24.cpu riscv -chain-position e24.cpu -coreid 0

# Variant 2: Attach to second TAP (hack for DM bypass in some reports; comment out Variant 1 and uncomment this)
# target create e24.cpu riscv -chain-position u74_tap -coreid 0

# RISC-V specific: Prefer system bus access (helps with some DM quirks); increase DMI timeout for slow E24 responses
riscv set_mem_access progbuf
riscv set_command_timeout_sec 10

# Initialize the JTAG connection
init
reset init
halt

# Optional: Poll for halt status (helps confirm if DM responds)
#poll on
#wait_halt 2000

