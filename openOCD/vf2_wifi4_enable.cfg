# 16.14.1 Xtensa Core Configuration
# Due to the high level of configurability in Xtensa cores, the Xtensa target
# configuration comprises two categories:
#
# Base Xtensa support common to all core configurations, and
# Core-specific support as configured for individual cores.
# All common Xtensa support is built into the OpenOCD Xtensa target layer and
# is enabled through a combination of Tcl scripts: the target-specific target/xtensa.cfg
# and a board-specific board/xtensa-*.cfg, similar to other target architectures.
#
# Importantly, core-specific configuration information must be provided by the user,
# and takes the form of an xtensa-core-XXX.cfg Tcl script that defines the core’s configurable
# features through a series of Xtensa configuration commands (detailed below).
#
# This core-specific xtensa-core-XXX.cfg file is typically either:
#
# Located within the Xtensa core configuration build as src/config/xtensa-core-openocd.cfg, or
# Generated by running the command xt-gdb --dump-oocd-config from the Xtensa processor tool-chain’s command-line tools.
# NOTE: xtensa-core-XXX.cfg must match the target Xtensa hardware connected to OpenOCD.



# --- JTAG Basics ---
transport select jtag
adapter speed 100
reset_config trst_only

source [find target/xtensa.cfg]
source [find target/xtensa-core-XXX.cfg]

# --- 1. Define ONLY the HiFi4 TAP ---
#jtag newtap hifi4 tap -irlen 5 -expected-id 0x120034e5 -ignore-version

# --- 2. CRITICAL: Lock chain to 1 TAP only ---
# This prevents OpenOCD from scanning beyond the first TAP
#jtag configure hifi4.tap -chain-position 0

# --- 5. Manually create the target ---
#target create hifi4.cpu xtensa -chain-position xtensa.cpu

# --- 6. Init: re-scan only our TAP ---
# init
# jtag arp_init
# targets hifi4.cpu
# halt

#echo ""
#echo "HiFi4 DSP is HALTED and ready for GDB"
#echo "  Connect with: xtensa-esp32-elf-gdb -ex 'target remote :3333'"
#echo ""
